name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Core commit
        id: core
        run: echo "sha=$(git -C nethack rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # the core only changes with the submodule or the build script, and takes minutes to build
      - name: Cache the WebAssembly core
        id: wasm
        uses: actions/cache@v6
        with:
          path: |
            public/nethack.js
            public/nethack.wasm
          key: wasm-${{ steps.core.outputs.sha }}-${{ hashFiles('scripts/build-wasm.sh') }}

      - name: Build the WebAssembly core
        if: steps.wasm.outputs.cache-hit != 'true'
        env:
          EMSDK: ${{ runner.temp }}/emsdk
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$EMSDK"
          "$EMSDK/emsdk" install 6.0.13
          "$EMSDK/emsdk" activate 6.0.13
          pnpm run build:wasm

      - run: pnpm run build

      - run: pnpm test

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
