name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Core commit
        id: core
        run: echo "sha=$(git -C nethack rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # the core only changes with the submodule or the build script, and takes minutes to build
      - name: Cache the WebAssembly core
        id: wasm
        uses: actions/cache@v6
        with:
          path: |
            public/nethack.js
            public/nethack.wasm
            public/tiles/tiles16.bmp
          key: wasm-${{ steps.core.outputs.sha }}-${{ hashFiles('scripts/build-wasm.sh') }}

      - name: Build the WebAssembly core
        if: steps.wasm.outputs.cache-hit != 'true'
        env:
          EMSDK: ${{ runner.temp }}/emsdk
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$EMSDK"
          "$EMSDK/emsdk" install 6.0.13
          "$EMSDK/emsdk" activate 6.0.13
          pnpm run build:wasm

      - run: pnpm run build

      - run: pnpm test

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm run test:e2e

      # a pull request from a fork gets no secrets, so can't deploy
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          wrangler="pnpm --allow-build=esbuild --allow-build=workerd dlx wrangler@4.155.0"
          $wrangler pages project create nethack-web --production-branch main || true
          $wrangler pages deploy dist --project-name nethack-web --branch "$BRANCH" | tee deploy.log
          echo "url=$(grep -oE 'https://[a-z0-9-]+\.nethack-web\.pages\.dev' deploy.log | head -1)" >> "$GITHUB_OUTPUT"

      - name: Link the preview from the pull request
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          gh pr comment "$PR" --edit-last --create-if-none --body "Preview: $URL"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
